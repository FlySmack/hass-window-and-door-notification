blueprint:
  name: Window, door and lock open detection and notification
  description: "v1.0.2 | Regularly test all sensors with 'window', 'door' and 'lock' device-class for open state and if so execute an action in case a specific weather condition has been raised, or a person has left the zone."
  domain: automation
  source_url: https://github.com/FlySmack/hass-window-and-door-notification/blob/main/hass-window-and-door-notification.yaml
  input:
    window_state:
      name: The state checked for device-class 'window'
      description: The window state above will trigger the action
      selector:
        select:
          options:
            - label: open
              value: 'on'
            - label: closed
              value: 'off'
    door_state:
      name: The state checked for device-class 'door'
      description: The door state above will trigger the action
      selector:
        select:
          options:
            - label: open
              value: 'on'
            - label: closed
              value: 'off'
    lock_state:
      name: The state checked for device-class 'lock'
      description: The lock state above will trigger the action
      selector:
        select:
          multiple: true
          options:
            - locked
            - unlocked
            - jammed
    weather_entity:
      name: The weather entity to check if it raining
      description: The weather state rain will trigger the action
      selector:
        entity:
          filter:
            domain: weather
    weather_state:
      name: The states checked for the weather entity
      description: The weather states above will trigger the action
      selector:
        select:
          multiple: true
          options:
            - hail
            - lightning
            - lightning-rainy
            - pouring
            - rainy
    person_entity:
      name: Person
      description: Optional trigger based on people leaving a zone and windows, doors, or locks are still open
      selector:
        entity:
          filter:
          - domain:
            - person
          multiple: true
    zone_entity:
      name: Zone
      description: Optional trigger based on people leaving a zone and windows, doors, or locks are still open
      selector:
        entity:
          filter:
          - domain:
            - zone
          multiple: false
    weather_translation_language:
      name: Select the language for the translation of the weather entities state
      description: Select the language for the translation of the weather entities state, which will be provided by the variable {{weather_translated}}
      selector:
        select:
          options:
            - label: DE
              value: 'de'
            - label: EN
              value: 'en'
    exclude:
      name: Excluded Sensors
      description: Window, door and lock devices (e.g. smartphone) to exclude from detection. Only entities are supported, devices must be expanded!
      default:
        entity_id: []
      selector:
        target:
          entity:
          - device_class:
            - window
            - door
            - lock
          - domain:
            - lock
    actions:
      name: Actions for weather and zone trigger
      description: Notifications or similar to be run when weather, or leaving the zone triggers the automation. {{sensors}} is replaced with the names of sensors are above states. {{weather_translated}} is replaced with the triggered weather state
      selector:
        action: {}
variables:
  window_state: !input window_state
  door_state: !input door_state
  lock_state: !input lock_state
  weather_entity: !input weather_entity
  exclude: !input exclude
  excluded_ids: >
    {% set _ei  = exclude.entity_id  if exclude.entity_id  is defined else [] %}
    {% set _di  = exclude.device_id  if exclude.device_id  is defined else [] %}
    {% set _ai  = exclude.area_id    if exclude.area_id    is defined else [] %}
    {% set _fi  = exclude.floor_id   if exclude.floor_id   is defined else [] %}
    {% set _li  = exclude.label_id   if exclude.label_id   is defined else [] %}
    {% set excl_entities = [_ei] if _ei is string else _ei %}
    {% set excl_devices  = [_di] if _di is string else _di %}
    {% set excl_areas    = [_ai] if _ai is string else _ai %}
    {% set excl_floors   = [_fi] if _fi is string else _fi %}
    {% set excl_labels   = [_li] if _li is string else _li %}
    {% set excl_sub      = exclude.exclude if exclude.exclude is defined else {} %}
    {% set _nei = excl_sub.entity_id if excl_sub.entity_id is defined else [] %}
    {% set _ndi = excl_sub.device_id if excl_sub.device_id is defined else [] %}
    {% set _nai = excl_sub.area_id   if excl_sub.area_id   is defined else [] %}
    {% set _nfi = excl_sub.floor_id  if excl_sub.floor_id  is defined else [] %}
    {% set _nli = excl_sub.label_id  if excl_sub.label_id  is defined else [] %}
    {% set not_entities  = [_nei] if _nei is string else _nei %}
    {% set not_devices   = [_ndi] if _ndi is string else _ndi %}
    {% set not_areas     = [_nai] if _nai is string else _nai %}
    {% set not_floors    = [_nfi] if _nfi is string else _nfi %}
    {% set not_labels    = [_nli] if _nli is string else _nli %}
    {% set ns = namespace(ids=[], not_ids=[]) %}
    {% for eid in excl_entities %}
      {% set ns.ids = ns.ids + [eid] %}
    {% endfor %}
    {% for did in excl_devices %}
      {% for eid in device_entities(did) %}
        {% set ns.ids = ns.ids + [eid] %}
      {% endfor %}
    {% endfor %}
    {% for aid in excl_areas %}
      {% for eid in area_entities(aid) %}
        {% set ns.ids = ns.ids + [eid] %}
      {% endfor %}
    {% endfor %}
    {% for fid in excl_floors %}
      {% for aid in floor_areas(fid) %}
        {% for eid in area_entities(aid) %}
          {% set ns.ids = ns.ids + [eid] %}
        {% endfor %}
      {% endfor %}
    {% endfor %}
    {% for lid in excl_labels %}
      {% for eid in label_entities(lid) %}
        {% set ns.ids = ns.ids + [eid] %}
      {% endfor %}
    {% endfor %}
    {% for eid in not_entities %}
      {% set ns.not_ids = ns.not_ids + [eid] %}
    {% endfor %}
    {% for did in not_devices %}
      {% for eid in device_entities(did) %}
        {% set ns.not_ids = ns.not_ids + [eid] %}
      {% endfor %}
    {% endfor %}
    {% for aid in not_areas %}
      {% for eid in area_entities(aid) %}
        {% set ns.not_ids = ns.not_ids + [eid] %}
      {% endfor %}
    {% endfor %}
    {% for fid in not_floors %}
      {% for aid in floor_areas(fid) %}
        {% for eid in area_entities(aid) %}
          {% set ns.not_ids = ns.not_ids + [eid] %}
        {% endfor %}
      {% endfor %}
    {% endfor %}
    {% for lid in not_labels %}
      {% for eid in label_entities(lid) %}
        {% set ns.not_ids = ns.not_ids + [eid] %}
      {% endfor %}
    {% endfor %}
    {{ ns.ids | unique | reject('in', ns.not_ids) | list | to_json }}
  weather_translation_language: !input weather_translation_language
  sensors: >
    {% set excl = excluded_ids | trim | from_json %}
    {% set result = namespace(sensors=[]) %}
    {% for state in states.binary_sensor | selectattr('attributes.device_class', '==', 'window') | selectattr('state', '==', window_state) %}
      {% if not state.entity_id in excl %}
        {% set area   = area_name(state.entity_id) %}
        {% set device = device_name(state.entity_id) %}
        {% set ename  = entity_name(state.entity_id) %}
        {% set label  = (area ~ ' › ' if area else '') ~ (device ~ ' · ' if device and device != ename else '') ~ ename %}
        {% set result.sensors = result.sensors + [label] %}
      {% endif %}
    {% endfor %}
    {% for state in states.binary_sensor | selectattr('attributes.device_class', '==', 'door') | selectattr('state', '==', door_state) %}
      {% if not state.entity_id in excl %}
        {% set area   = area_name(state.entity_id) %}
        {% set device = device_name(state.entity_id) %}
        {% set ename  = entity_name(state.entity_id) %}
        {% set label  = (area ~ ' › ' if area else '') ~ (device ~ ' · ' if device and device != ename else '') ~ ename %}
        {% set result.sensors = result.sensors + [label] %}
      {% endif %}
    {% endfor %}
    {% for state in states.lock | selectattr('state', 'in', lock_state) %}
      {% if not state.entity_id in excl %}
        {% set area   = area_name(state.entity_id) %}
        {% set device = device_name(state.entity_id) %}
        {% set ename  = entity_name(state.entity_id) %}
        {% set label  = (area ~ ' › ' if area else '') ~ (device ~ ' · ' if device and device != ename else '') ~ ename %}
        {% set result.sensors = result.sensors + [label] %}
      {% endif %}
    {% endfor %}
    {{result.sensors|join(', ')}}
  weather_translated: >
    {% set result = namespace(weather_translated='') %}
    {% if weather_translation_language == 'de' %}
        {% if states(weather_entity) == 'clear-night' %}
            {% set result.weather_translated = "klare Nacht" %}
        {% elif states(weather_entity) == 'cloudy' %}
            {% set result.weather_translated = "Wolkig" %}
        {% elif states(weather_entity) == 'fog' %}
            {% set result.weather_translated = "Nebel" %}
        {% elif states(weather_entity) == 'hail' %}
            {% set result.weather_translated = "Hagel" %}
        {% elif states(weather_entity) == 'lightning' %}
            {% set result.weather_translated = "Gewitter" %}
        {% elif states(weather_entity) == 'lightning-rainy' %}
            {% set result.weather_translated = "Gewitter mit Regen" %}
        {% elif states(weather_entity) == 'partlycloudy' %}
            {% set result.weather_translated = "teilweise Bewölkt" %}
        {% elif states(weather_entity) == 'pouring' %}
            {% set result.weather_translated = "Starkregen" %}
        {% elif states(weather_entity) == 'rainy' %}
            {% set result.weather_translated = "Regen" %}
        {% elif states(weather_entity) == 'snowy' %}
            {% set result.weather_translated = "Schnee" %}
        {% elif states(weather_entity) == 'snowy-rainy' %}
            {% set result.weather_translated = "Schneeregen" %}
        {% elif states(weather_entity) == 'sunny' %}
            {% set result.weather_translated = "Sonnig" %}
        {% elif states(weather_entity) == 'windy' %}
            {% set result.weather_translated = "Windig" %}
        {% elif states(weather_entity) == 'windy-variant' %}
            {% set result.weather_translated = "Windig aus wechselnden Richtungen" %}
        {% elif states(weather_entity) == 'exceptional' %}
            {% set result.weather_translated = "ausserordentliches Wetter" %}
        {% endif %}
        {{ result.weather_translated }}
    {% else %}
        {{ states(weather_entity) }}
    {% endif %}
trigger:
  - platform: state
    entity_id: !input weather_entity
    to: !input weather_state
  - platform: zone
    entity_id: !input person_entity
    zone: !input zone_entity
    event: leave
condition:
  - condition: template
    value_template: "{{ sensors != '' }}"
action:
- choose: []
  default: !input actions
mode: single
